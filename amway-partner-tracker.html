<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夥伴資料管理</title>
<style>
  :root{
    --ink:#1c2b23;
    --paper:#f7f5ef;
    --line:#d9d3c4;
    --accent:#2f6b4f;
    --accent-dark:#204a37;
    --warn:#b5651d;
    --danger:#9b3232;
    --muted:#7a7568;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:28px 24px 20px;
    border-bottom:1px solid var(--line);
    background:var(--card);
  }
  header h1{
    margin:0 0 4px;
    font-size:22px;
    letter-spacing:0.02em;
    font-weight:700;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin:18px 0 14px;
  }
  .toolbar .stats{
    font-size:13px;
    color:var(--muted);
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }
  .stats b{color:var(--ink);}
  .stats .alert{color:var(--warn); font-weight:600;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:6px;
    font-size:14px;
    padding:9px 16px;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:disabled{opacity:0.5; cursor:not-allowed;}
  button:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:#fff; font-weight:600;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent; color:var(--accent-dark); border:1px solid var(--line);}
  .btn-ghost:hover{background:#eef2ee;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid #e3c9c9;}
  .btn-danger:hover{background:#fbeeee;}
  .search{
    flex:1;
    min-width:180px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:14px;
    background:#fff;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  thead th{
    text-align:left;
    padding:10px 12px;
    background:#eef1ea;
    color:var(--muted);
    font-weight:600;
    font-size:12.5px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
  }
  thead th:hover{color:var(--ink);}
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid #ece8dd;
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbfaf6;}
  .id-code{font-variant-numeric:tabular-nums; color:var(--muted);}
  .pw{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px;}
  .badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:600;
    white-space:nowrap;
  }
  .badge-ok{background:#e5f0e8; color:var(--accent-dark);}
  .badge-soon{background:#fbeadb; color:var(--warn);}
  .badge-over{background:#f6e1e1; color:var(--danger);}
  .row-actions{display:flex; gap:6px;}
  .row-actions button{padding:5px 9px; font-size:12.5px;}
  .empty{
    padding:50px 20px;
    text-align:center;
    color:var(--muted);
  }
  .overlay{
    position:fixed; inset:0;
    background:rgba(28,43,35,0.45);
    display:none;
    align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff;
    border-radius:12px;
    width:100%;
    max-width:480px;
    max-height:92vh;
    overflow-y:auto;
    padding:24px;
  }
  .modal h2{margin:0 0 18px; font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:5px;
    font-weight:600;
  }
  .field input{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:100;
    max-width:80vw;
    text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .hint{font-size:12px; color:var(--muted); margin-top:16px; line-height:1.6;}
  .sync-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:#ccc;
    margin-right:6px;
    vertical-align:middle;
  }
  .sync-dot.ok{background:var(--accent);}
  .sync-dot.err{background:var(--danger);}
  .sync-row{font-size:12px; color:var(--muted); display:flex; align-items:center; margin-top:6px;}
  @media (max-width:720px){
    .card{overflow-x:auto;}
    table{min-width:820px;}
  }
</style>
</head>
<body>

<header>
  <h1>台馬安利夥伴資料管理</h1>
  <p>記錄夥伴加入資料與續約時間 · 台灣 / 馬來西亞共同維護</p>
  <div class="sync-row"><span class="sync-dot" id="syncDot"></span><span id="syncText">連線中...</span></div>
</header>

<div class="wrap">

  <div class="toolbar">
    <input class="search" id="searchInput" placeholder="搜尋姓名 / 安利編號 / 推薦人..." />
    <div style="display:flex; gap:8px;">
      <button class="btn-ghost" id="refreshBtn">重新整理</button>
      <button class="btn-ghost" id="exportBtn">匯出 CSV</button>
      <button class="btn-primary" id="addBtn">＋ 新增夥伴</button>
    </div>
  </div>

  <div class="toolbar" style="margin-top:0;">
    <div class="stats">
      <span>總計 <b id="statTotal">0</b> 人</span>
      <span class="alert">60 天內到期 <b id="statSoon">0</b> 人</span>
      <span style="color:var(--danger); font-weight:600;">已逾期 <b id="statOver">0</b> 人</span>
    </div>
  </div>

  <div class="card">
    <table id="table">
      <thead>
        <tr>
          <th data-key="name">姓名</th>
          <th data-key="amwayId">安利編號</th>
          <th data-key="login">登入帳號</th>
          <th data-key="password">密碼</th>
          <th data-key="referrer">國際推薦</th>
          <th data-key="renewDate">續約日期</th>
          <th data-key="joinDate">加入日期</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">目前沒有資料，點右上角「新增夥伴」開始建立。</div>
  </div>

  <p class="hint">資料即時同步到 Google 試算表，台灣、馬來西亞夥伴打開同一個網頁連結，看到、編輯的都是同一份資料。密碼欄位為明碼儲存，請僅將此頁面連結分享給核心團隊成員。</p>

</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">新增夥伴</h2>
    <input type="hidden" id="editId" />
    <div class="field">
      <label>姓名</label>
      <input id="f_name" placeholder="例：Lee Jia Jie" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>安利編號</label>
        <input id="f_amwayId" placeholder="例：7013228107" />
      </div>
      <div class="field">
        <label>國際推薦人</label>
        <input id="f_referrer" placeholder="例：嘉容姐" />
      </div>
    </div>
    <div class="field">
      <label>登入帳號 (Email)</label>
      <input id="f_login" placeholder="例：name@gmail.com" />
    </div>
    <div class="field">
      <label>密碼</label>
      <input id="f_password" placeholder="登入密碼" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>續約日期 (renew)</label>
        <input id="f_renewDate" type="date" />
      </div>
      <div class="field">
        <label>加入日期</label>
        <input id="f_joinDate" type="date" />
      </div>
    </div>
    <div class="field">
      <label>備註</label>
      <input id="f_note" placeholder="選填" />
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">取消</button>
      <button class="btn-danger" id="deleteBtn" style="display:none;">刪除</button>
      <button class="btn-primary" id="saveBtn">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx2783Jf4phgSjnzIZRj_LIGIxnSCzABqq2-D_5AET7NPROz3YdPLR9vMyFMvSA1Hhagg/exec";

let partners = [];
let sortKey = "renewDate";
let sortAsc = true;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

function setSyncStatus(state, text){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncText');
  dot.className = 'sync-dot ' + (state === 'ok' ? 'ok' : state === 'err' ? 'err' : '');
  label.textContent = text;
}

function uid(){
  return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

async function loadPartners(){
  setSyncStatus('', '連線中...');
  try{
    const res = await fetch(API_URL, { method: 'GET' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    partners = Array.isArray(json) ? json : [];
    setSyncStatus('ok', '已同步 Google 試算表');
  }catch(e){
    setSyncStatus('err', '連線失敗，請點「重新整理」再試');
    toast('讀取資料失敗，請檢查網路連線');
  }
  render();
}

async function apiPost(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr);
  if(isNaN(target)) return null;
  return Math.round((target - today) / 86400000);
}

function renewBadge(dateStr){
  if(!dateStr) return '<span class="badge" style="background:#eee;color:#999;">未設定</span>';
  const d = daysUntil(dateStr);
  if(d === null) return `<span class="badge" style="background:#eee;color:#999;">${escapeHtml(dateStr)}</span>`;
  const label = dateStr;
  if(d < 0) return `<span class="badge badge-over">${label} · 已逾期</span>`;
  if(d <= 60) return `<span class="badge badge-soon">${label} · ${d}天內</span>`;
  return `<span class="badge badge-ok">${label}</span>`;
}

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = partners.filter(p=>{
    if(!q) return true;
    return [p.name,p.amwayId,p.referrer,p.login].join(' ').toLowerCase().includes(q);
  });

  list.sort((a,b)=>{
    let va = (a[sortKey]||'').toString();
    let vb = (b[sortKey]||'').toString();
    if(sortKey==='renewDate' || sortKey==='joinDate'){
      va = va || '9999-99-99';
      vb = vb || '9999-99-99';
    }
    const cmp = va.localeCompare(vb, 'zh-Hant');
    return sortAsc ? cmp : -cmp;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';

  for(const p of list){
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${escapeHtml(p.name||'')}</b></td>
      <td class="id-code">${escapeHtml(String(p.amwayId||''))}</td>
      <td>${escapeHtml(p.login||'')}</td>
      <td class="pw">${escapeHtml(p.password||'')}</td>
      <td>${escapeHtml(p.referrer||'')}</td>
      <td>${renewBadge(p.renewDate)}</td>
      <td>${escapeHtml(p.joinDate||'')}</td>
      <td>
        <div class="row-actions">
          <button class="btn-ghost" data-edit="${p.id}">編輯</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  }

  document.getElementById('statTotal').textContent = partners.length;
  document.getElementById('statSoon').textContent = partners.filter(p=>{
    const d = daysUntil(p.renewDate);
    return d !== null && d >= 0 && d <= 60;
  }).length;
  document.getElementById('statOver').textContent = partners.filter(p=>{
    const d = daysUntil(p.renewDate);
    return d !== null && d < 0;
  }).length;

  tbody.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=> openModal(btn.getAttribute('data-edit')));
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openModal(id){
  const overlay = document.getElementById('overlay');
  const isEdit = !!id;
  document.getElementById('modalTitle').textContent = isEdit ? '編輯夥伴' : '新增夥伴';
  document.getElementById('deleteBtn').style.display = isEdit ? 'inline-block' : 'none';
  document.getElementById('editId').value = id || '';

  const p = isEdit ? (partners.find(x=>x.id===id) || {}) : {};
  document.getElementById('f_name').value = p.name || '';
  document.getElementById('f_amwayId').value = p.amwayId || '';
  document.getElementById('f_referrer').value = p.referrer || '';
  document.getElementById('f_login').value = p.login || '';
  document.getElementById('f_password').value = p.password || '';
  document.getElementById('f_renewDate').value = p.renewDate || '';
  document.getElementById('f_joinDate').value = p.joinDate || '';
  document.getElementById('f_note').value = p.note || '';

  overlay.classList.add('open');
  document.getElementById('f_name').focus();
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}

async function handleSave(){
  const id = document.getElementById('editId').value;
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('請輸入姓名'); return; }

  const record = {
    id: id || uid(),
    name,
    amwayId: document.getElementById('f_amwayId').value.trim(),
    referrer: document.getElementById('f_referrer').value.trim(),
    login: document.getElementById('f_login').value.trim(),
    password: document.getElementById('f_password').value.trim(),
    renewDate: document.getElementById('f_renewDate').value,
    joinDate: document.getElementById('f_joinDate').value,
    note: document.getElementById('f_note').value.trim(),
  };

  document.getElementById('saveBtn').disabled = true;
  try{
    await apiPost({ action: id ? 'update' : 'create', record });
    toast(id ? '已更新並同步' : '已新增並同步');
    closeModal();
    await loadPartners();
  }catch(e){
    toast('儲存失敗，請檢查網路後再試');
  }finally{
    document.getElementById('saveBtn').disabled = false;
  }
}

async function handleDelete(){
  const id = document.getElementById('editId').value;
  if(!id) return;
  if(!confirm('確定要刪除這位夥伴的資料嗎？')) return;
  document.getElementById('deleteBtn').disabled = true;
  try{
    await apiPost({ action: 'delete', id });
    toast('已刪除並同步');
    closeModal();
    await loadPartners();
  }catch(e){
    toast('刪除失敗，請檢查網路後再試');
  }finally{
    document.getElementById('deleteBtn').disabled = false;
  }
}

function exportCsv(){
  const headers = ['姓名','安利編號','登入帳號','密碼','國際推薦','續約日期','加入日期','備註'];
  const rows = partners.map(p=>[p.name,p.amwayId,p.login,p.password,p.referrer,p.renewDate,p.joinDate,p.note]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '夥伴資料.csv';
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('addBtn').addEventListener('click', ()=>openModal(null));
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('saveBtn').addEventListener('click', handleSave);
document.getElementById('deleteBtn').addEventListener('click', handleDelete);
document.getElementById('exportBtn').addEventListener('click', exportCsv);
document.getElementById('refreshBtn').addEventListener('click', loadPartners);
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeModal();
});
document.querySelectorAll('thead th[data-key]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.getAttribute('data-key');
    if(sortKey === key){ sortAsc = !sortAsc; } else { sortKey = key; sortAsc = true; }
    render();
  });
});

loadPartners();
</script>

</body>
</html>
